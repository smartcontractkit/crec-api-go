name: openapi-backwards-compat

on:
  pull_request:
    branches:
      - main
    paths:
      - api/openapi.yaml

jobs:
  check-breaking-changes:
    name: Check for OpenAPI breaking changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run backwards-compatibility check
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        with:
          model: ${{ vars.OPENCODE_MODEL || 'fireworks-ai/accounts/fireworks/models/deepseek-v4-pro-0813' }}
          use_github_token: "true"
          prompt: |
            Review this pull request for backwards-incompatible changes to
            api/openapi.yaml. Read and follow the instructions in
            .github/agent_prompts/check-openapi-backwards-compat.md exactly.
