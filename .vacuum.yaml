extends: [[spectral:oas, recommended]]
rules:
  operation-operationId: true
  operation-tags: true
  oas3-api-servers: true
  oas3-schema: true
  oas3-unused-component: true
  oas3-parameter-description: true
  operation-description: true
  oas3-missing-example: true
  component-description: true
  oas3-valid-schema-example: error

  # snake_case JSON property names are the intentional wire format for this API;
  # renaming to camelCase would be a breaking change.
  camel-case-properties: false

  # Error response descriptions (e.g. "Not found", "Internal server error") repeat
  # across endpoints by design — they describe the same error type consistently.
  description-duplication: false

  # Every operation must declare the crec:* permission(s) it requires, or
  # explicitly declare x-permissions: [] for an intentional exemption
  # (see cmd/gen-permissions exemptRoutes). The authoritative, exemption-aware
  # gate is `task lint:permissions` (cmd/gen-permissions) — this rule just
  # surfaces the same problem earlier, in `vacuum lint` / the vacuum language
  # server.
  x-permissions-required:
    description: Every operation must declare the crec:* permission(s) it requires, or explicitly declare x-permissions:[] for an intentional exemption (see cmd/gen-permissions exemptRoutes)
    message: "operation is missing x-permissions: [crec:<resource>:<action>, ...] (or x-permissions: [] for an intentional exemption)"
    severity: error
    given: $.paths[*][*]
    then:
      field: x-permissions
      function: schema
      functionOptions:
        forceValidation: true
        schema:
          type: array
          minItems: 0
          items:
            type: string
            pattern: "^crec:[^:]+:[^:]+(:[^:]+)?$"
